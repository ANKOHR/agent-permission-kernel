[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-permission-kernel"
version = "0.1.0"
description = "A deterministic permission decision engine for synthetic agent fixtures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
apk = "apk.cli:main"

[tool.setuptools.packages.find]
include = ["apk*"]

[tool.setuptools.package-data]
apk = ["data/*.yaml", "data/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

